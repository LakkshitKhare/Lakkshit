<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('lakkshit-theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#efeee9');
      })();
    </script>
    <title>Lakkshit &mdash; Khare | Software Engineer</title>
    <meta name="description" content="Lakkshit Khare &mdash; Software Engineer working across full-stack development, AI/ML, backend engineering and modern software systems." />
